<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Preços</title>
    <link rel="stylesheet" href="stiles/style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora de Compras</h1>

        <p class="row-info"><strong>Preço do Produto:</strong> <span id="preco"></span></p>
        <p class="row-info"><strong>Quantidade:</strong> <span id="quantidade"></span></p>
        <p class="row-info total-row"><strong>Total da Compra:</strong> <span id="total"></span></p>
        <p class="row-info"><strong>Dobro do Total:</strong> <span id="dobro"></span></p>
        <p class="row-info"><strong>Resto da Divisão por 2:</strong> <span id="resto"></span></p>

        <h2>Benefícios</h2>
        <p class="row-info benefit-row"><strong>Cupom Válido:</strong> <span id="cupom"></span></p>
        <p class="row-info benefit-row"><strong>Frete Grátis:</strong> <span id="frete"></span></p>
        <p class="row-info benefit-row"><strong>Algum Benefício (OU):</strong> <span id="algum"></span></p>
        <p class="row-info benefit-row"><strong>Todos os Benefícios (E):</strong> <span id="todos"></span></p>
    </div>
    
    <script src="scripts/script.js"></script>
</body>
</html>
